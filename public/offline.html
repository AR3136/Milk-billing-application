<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Ganga Dairy Farm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f1f5f9;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 1.5rem;
      object-fit: contain;
      background: #1e293b;
      padding: 8px;
    }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    p  { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; max-width: 320px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 1.5rem;
      padding: 8px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 999px;
      font-size: 0.8rem;
      color: #64748b;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
    button {
      margin-top: 2rem;
      padding: 12px 28px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <img src="/logo.png" alt="Ganga Dairy Farm" class="logo" />
  <h1>You're Offline</h1>
  <p>No internet connection detected. Some features may be limited until you reconnect.</p>
  <div class="badge">
    <span class="dot"></span>
    No network connection
  </div>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
